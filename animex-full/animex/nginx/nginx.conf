worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain text/css application/javascript application/json;
  gzip_min_length 1000;

  # Rate limit zones
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

  upstream backend {
    server backend:4000;
    keepalive 32;
  }

  # ── HTTP → redirect to HTTPS (uncomment after SSL setup) ────────────────
  # server {
  #   listen 80;
  #   server_name YOUR_DOMAIN;
  #   location /.well-known/acme-challenge/ { root /var/www/certbot; }
  #   location / { return 301 https://$host$request_uri; }
  # }

  # ── MAIN SERVER (HTTP during setup / HTTPS after SSL) ───────────────────
  server {
    listen 80;
    # listen 443 ssl;                                          # uncomment after SSL
    server_name _;

    # SSL — uncomment after certbot
    # ssl_certificate     /etc/nginx/ssl/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/live/YOUR_DOMAIN/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options        DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy        no-referrer;
    add_header X-XSS-Protection       "1; mode=block";

    # ── STATIC FRONTEND ─────────────────────────────────────────────────
    root  /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri.html $uri/ /index.html;
      expires 1h;
      add_header Cache-Control "public, must-revalidate";
    }

    location ~* \.(css|js)$ {
      expires 7d;
      add_header Cache-Control "public, immutable";
    }

    # ── API PROXY ────────────────────────────────────────────────────────
    location /api/ {
      limit_req zone=api burst=50 nodelay;
      proxy_pass         http://backend;
      proxy_http_version 1.1;
      proxy_set_header   Connection        "";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }

    # Stricter rate limit on auth endpoints
    location /api/auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass         http://backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── CERTBOT CHALLENGE ────────────────────────────────────────────────
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }
  }
}
