version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       animex
      POSTGRES_USER:     animex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U animex"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [animex]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [animex]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV:          production
      PORT:              4000
      DATABASE_URL:      postgresql://animex:${POSTGRES_PASSWORD}@postgres:5432/animex
      REDIS_URL:         redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET:        ${JWT_SECRET}
      STREAM_SECRET:     ${STREAM_SECRET}
      MIRROR_ENC_KEY:    ${MIRROR_ENC_KEY}
      RESEND_API_KEY:    ${RESEND_API_KEY}
      APP_URL:           ${APP_URL}
      APP_DOMAIN:        ${APP_DOMAIN}
      ALLOWED_ORIGINS:   ${APP_URL}
    networks: [animex]
    expose: ["4000"]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro          # mount after certbot runs
      - certbot_www:/var/www/certbot:ro
    networks: [animex]

  certbot:
    image: certbot/certbot
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    profiles: ["ssl"]   # run manually: docker compose --profile ssl run certbot

volumes:
  postgres_data:
  redis_data:
  certbot_www:

networks:
  animex:
    driver: bridge
