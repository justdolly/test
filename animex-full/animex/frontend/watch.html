<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANIMEX — Watch</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
.watch-page{padding-top:calc(var(--nav-h)+32px)}
.watch-inner{max-width:var(--max-w);margin:0 auto;padding:0 2rem 4rem}

/* PLAYER */
.player-wrap{
  position:relative;width:100%;background:#000;
  border-radius:var(--radius-lg);overflow:hidden;
  border:1px solid var(--border);
  box-shadow:0 20px 60px rgba(0,0,0,0.7);
  margin-bottom:0;
}
.player-wrap::before{content:'';display:block;padding-top:56.25%}
.player-inner{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:1rem;
}
.player-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.12;filter:blur(8px)}
.play-big{
  width:74px;height:74px;border-radius:50%;
  background:rgba(255,255,255,0.14);border:2px solid rgba(255,255,255,0.28);
  display:flex;align-items:center;justify-content:center;font-size:28px;
  color:var(--white);cursor:pointer;transition:all .2s;position:relative;z-index:1;
  backdrop-filter:blur(10px);
}
.play-big:hover{background:rgba(255,255,255,0.24);transform:scale(1.07)}
.player-msg{font-size:13px;color:var(--text2);position:relative;z-index:1;text-align:center}
.player-msg b{color:var(--white)}

/* SKIP BTNS */
.skip-btns{position:absolute;bottom:16px;right:16px;display:flex;gap:8px;z-index:10}
.skip-btn{
  padding:7px 16px;border-radius:100px;
  background:rgba(0,0,0,0.75);border:1px solid rgba(255,255,255,0.2);
  color:var(--white);font-size:12px;font-weight:600;
  cursor:pointer;transition:all .2s;backdrop-filter:blur(8px);
  display:flex;align-items:center;gap:6px;
}
.skip-btn:hover{background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.4)}

/* CONTROLS BAR */
.controls-bar{
  background:var(--glass);border:1px solid var(--border);
  border-radius:0 0 var(--radius-lg) var(--radius-lg);
  padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  backdrop-filter:blur(12px);margin-bottom:1rem;
  border-top:none;
}
.ctrl-group{display:flex;align-items:center;gap:5px}
.ctrl-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px}
.ctrl-divider{width:1px;height:20px;background:var(--border);flex-shrink:0}
.lang-ctrl{display:flex;background:var(--bg3);border:1px solid var(--border);border-radius:7px;overflow:hidden}
.lc-btn{padding:5px 12px;font-size:11px;font-weight:700;color:var(--text3);transition:all .2s}
.lc-btn.active{background:var(--white);color:#000}
.server-btn{
  display:flex;align-items:center;gap:6px;
  padding:5px 13px;border-radius:7px;
  background:var(--glass);border:1px solid var(--border);
  font-size:12px;font-weight:500;color:var(--text2);transition:all .2s;
}
.server-btn:hover{background:var(--glass-hi);color:var(--white)}
.server-btn.active{background:var(--white);color:#000;border-color:var(--white)}
.sdot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5}
.server-btn.active .sdot{opacity:1}
.report-btn{margin-left:auto;font-size:11px;color:var(--text3);display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:6px;transition:color .2s}
.report-btn:hover{color:var(--text)}

/* WATCH GRID — player left, episode panel right */
.watch-grid{display:grid;grid-template-columns:1fr 300px;gap:1.5rem;align-items:start}
.watch-main{min-width:0}

/* EPISODE PANEL */
.ep-panel{
  background:var(--glass);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;
}
.ep-panel-head{
  padding:10px 14px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.ep-panel-title{font-family:var(--font-display);font-size:14px;font-weight:600;color:var(--white);display:flex;align-items:center;gap:8px}
.ep-collapse-btn{
  width:28px;height:28px;border-radius:6px;
  background:var(--glass);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--text2);transition:all .2s;
}
.ep-collapse-btn:hover{background:var(--glass-hi);color:var(--white)}
.ep-panel-body{transition:max-height .3s ease,opacity .3s ease;overflow:hidden}
.ep-panel-body.collapsed{max-height:0!important;opacity:0}

.ep-tools{display:flex;align-items:center;gap:6px;padding:8px 14px;border-bottom:1px solid var(--border)}
.ep-search-in{
  flex:1;background:var(--bg3);border:1px solid var(--border);
  border-radius:6px;padding:5px 10px;font-size:12px;
  color:var(--text);outline:none;font-family:var(--font-body);
}
.ep-search-in:focus{border-color:var(--border-hi)}
.ep-layout-btns{display:flex;gap:3px}
.ep-lay-btn{
  width:28px;height:28px;border-radius:6px;
  background:var(--glass);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--text3);transition:all .2s;
}
.ep-lay-btn.active{background:var(--white);color:#000;border-color:var(--white)}

.ep-range{display:flex;gap:4px;padding:8px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.range-btn{font-size:11px;padding:3px 9px;border-radius:5px;background:var(--glass);border:1px solid var(--border);color:var(--text3);transition:all .2s}
.range-btn.active{background:var(--white);color:#000;border-color:var(--white)}

/* EP GRID */
.ep-scroll{padding:10px 14px;max-height:400px;overflow-y:auto}
.ep-scroll::-webkit-scrollbar{width:3px}
.ep-nums-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:5px}
.ep-btn{
  aspect-ratio:1;border-radius:7px;
  background:var(--glass);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:500;color:var(--text2);
  cursor:pointer;transition:all .2s;text-decoration:none;
}
.ep-btn:hover{background:var(--glass-hi);color:var(--white)}
.ep-btn.active{background:var(--white);color:#000;border-color:var(--white)}
.ep-btn.watched{opacity:.35}

/* EP LIST MODE */
.ep-list-mode{display:flex;flex-direction:column;gap:3px}
.ep-list-item{
  display:flex;align-items:center;gap:8px;
  padding:7px 10px;border-radius:7px;
  background:var(--glass);border:1px solid transparent;
  cursor:pointer;transition:all .15s;text-decoration:none;
}
.ep-list-item:hover{background:var(--glass-hi);border-color:var(--border)}
.ep-list-item.active{background:rgba(255,255,255,0.1);border-color:var(--border-hi)}
.ep-list-num{font-size:11px;font-weight:700;color:var(--text2);width:32px;flex-shrink:0}
.ep-list-title{font-size:12px;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep-list-dur{font-size:10px;color:var(--text3)}

/* EP NAV */
.ep-nav{display:flex;gap:10px;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.ep-nav-info{font-size:14px;color:var(--text2);flex:1}
.ep-nav-info strong{color:var(--white);font-family:var(--font-display);font-size:16px}

/* ANIME STRIP */
.anime-strip{
  display:flex;gap:1.2rem;align-items:flex-start;
  padding:1.2rem;background:var(--glass);border:1px solid var(--border);
  border-radius:var(--radius);margin-bottom:1.5rem;
}
.strip-poster{width:70px;height:98px;object-fit:cover;border-radius:8px;flex-shrink:0;background:var(--bg3)}
.strip-info{flex:1;min-width:0}
.strip-title{font-family:var(--font-display);font-size:18px;font-weight:700;color:var(--white);margin-bottom:6px}
.strip-meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}
.strip-desc{font-size:13px;color:var(--text2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* RECOMMENDED — shown between comments and bottom, fills space */
.reco-strip{
  display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;margin-bottom:2rem;
}
.reco-strip::-webkit-scrollbar{height:3px}
.reco-card{
  flex-shrink:0;width:120px;border-radius:var(--radius);overflow:hidden;
  background:var(--glass);border:1px solid var(--border);
  cursor:pointer;transition:transform .2s,border-color .2s;display:block;
}
.reco-card:hover{transform:translateY(-4px);border-color:var(--border-hi)}
.reco-card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:var(--bg3)}
.reco-card-body{padding:7px 8px 9px}
.reco-title{font-size:11px;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:2px}
.reco-meta{font-size:9px;color:var(--text3)}

/* COMMENTS */
.comments-section{margin-top:2rem}
.comment-input-wrap{display:flex;gap:12px;margin-bottom:1.5rem;align-items:flex-start}
.comment-avatar-me{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  background:var(--bg4);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text3);
}
.comment-box{flex:1}
.comment-ta{
  width:100%;background:var(--glass);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;
  color:var(--text);font-family:var(--font-body);outline:none;
  resize:none;min-height:68px;transition:border-color .2s;line-height:1.5;
}
.comment-ta:focus{border-color:var(--border-hi)}
.comment-ta::placeholder{color:var(--text3)}
.comment-actions-row{display:flex;justify-content:flex-end;margin-top:6px;gap:8px;align-items:center}
.comment-note{font-size:11px;color:var(--text3)}
.comment-list{display:flex;flex-direction:column;gap:0}
.comment-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
.comment-item:last-child{border-bottom:none}
.c-avatar{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  background:var(--bg3);display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:14px;font-weight:700;color:var(--text2);
  border:1px solid var(--border);overflow:hidden;
}
.c-body{flex:1;min-width:0}
.c-head{display:flex;align-items:center;gap:10px;margin-bottom:5px;flex-wrap:wrap}
.c-user{font-size:13px;font-weight:600;color:var(--white)}
.c-time{font-size:11px;color:var(--text3)}
.c-ep-tag{font-size:10px;color:var(--text3);background:var(--glass);border:1px solid var(--border);padding:2px 7px;border-radius:4px}
.c-text{font-size:13px;color:var(--text2);line-height:1.65;margin-bottom:8px}
.c-acts{display:flex;gap:14px}
.c-act{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:4px;transition:color .2s}
.c-act:hover{color:var(--text)}
.c-likes{font-weight:600;color:var(--text2)}

/* BOTTOM RELATED */
.bottom-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px;margin-top:10px;margin-bottom:2.5rem}

@media(max-width:1000px){
  .watch-grid{grid-template-columns:1fr}
  .ep-panel{margin-top:1rem}
  .ep-scroll{max-height:280px}
}
</style>
</head>
<body>
<script src="nav.js"></script>
<script>injectNav('');</script>

<div class="watch-page">
<div class="watch-inner">
  <div class="watch-grid">

    <!-- MAIN -->
    <div class="watch-main">
      <!-- PLAYER -->
      <div class="player-wrap" id="playerWrap">
        <div class="player-inner" id="playerInner">
          <img class="player-bg" id="playerBg" src="" alt="">
          <button class="play-big" onclick="triggerPlay()"><i class="fa-solid fa-play"></i></button>
          <div class="player-msg">Select a server to play <b id="epLabel">Episode 1</b></div>
        </div>
        <div class="skip-btns" id="skipBtns" style="display:none">
          <button class="skip-btn" onclick="skipSection('intro')"><i class="fa-solid fa-forward-fast"></i> Skip Intro</button>
          <button class="skip-btn" id="skipOutroBtn" style="display:none" onclick="skipSection('outro')"><i class="fa-solid fa-forward-fast"></i> Skip Outro</button>
        </div>
      </div>

      <!-- CONTROLS -->
      <div class="controls-bar">
        <div class="ctrl-group">
          <span class="ctrl-label">Lang</span>
          <div class="lang-ctrl">
            <button class="lc-btn active" id="lcSub" onclick="setLang('sub')">SUB</button>
            <button class="lc-btn" id="lcDub" onclick="setLang('dub')">DUB</button>
          </div>
        </div>
        <div class="ctrl-divider"></div>
        <div class="ctrl-group">
          <span class="ctrl-label">Server</span>
          <button class="server-btn active" onclick="setServer(this)"><span class="sdot"></span>Vidcloud</button>
          <button class="server-btn" onclick="setServer(this)"><span class="sdot"></span>Filemoon</button>
          <button class="server-btn" onclick="setServer(this)"><span class="sdot"></span>Streamtape</button>
          <button class="server-btn" onclick="setServer(this)"><span class="sdot"></span>Backup</button>
        </div>
        <button class="report-btn"><i class="fa-solid fa-flag"></i> Report</button>
      </div>

      <!-- EP NAV -->
      <div class="ep-nav">
        <div class="ep-nav-info">
          <strong id="animeTitle">Loading...</strong>
          <span id="epNavLabel" style="margin-left:8px;font-size:13px;color:var(--text2)"></span>
        </div>
        <button class="btn-glass" id="prevBtn" style="display:none" onclick="changeEp(-1)"><i class="fa-solid fa-chevron-left"></i> Prev</button>
        <button class="btn-glass" id="nextBtn" style="display:none" onclick="changeEp(1)">Next <i class="fa-solid fa-chevron-right"></i></button>
        <a id="detailLink" href="#" class="btn-glass"><i class="fa-solid fa-circle-info"></i> Details</a>
      </div>

      <!-- ANIME STRIP -->
      <div class="anime-strip" id="animeStrip">
        <div class="shimmer strip-poster"></div>
        <div style="flex:1">
          <div class="shimmer" style="height:18px;width:55%;border-radius:5px;margin-bottom:8px"></div>
          <div style="display:flex;gap:6px;margin-bottom:8px">${Array(3).fill(0).map(()=>`<div class="shimmer" style="height:20px;width:55px;border-radius:5px"></div>`).join('')}</div>
          <div class="shimmer" style="height:13px;border-radius:4px;margin-bottom:5px"></div>
          <div class="shimmer" style="height:13px;width:70%;border-radius:4px"></div>
        </div>
      </div>

      <!-- RECOMMENDED — above comments to fill the space -->
      <div id="recoSection" style="margin-bottom:2rem">
        <div class="sec-header"><div class="sec-title">You Might Also Like</div></div>
        <div class="reco-strip" id="recoStrip">
          ${Array(8).fill(0).map(()=>`<div class="reco-card" style="pointer-events:none"><div style="aspect-ratio:2/3" class="shimmer"></div><div class="reco-card-body"><div class="shimmer" style="height:11px;border-radius:3px;margin-bottom:4px"></div><div class="shimmer" style="height:9px;width:50%;border-radius:3px"></div></div></div>`).join('')}
        </div>
      </div>

      <!-- COMMENTS -->
      <div class="comments-section">
        <div class="sec-header">
          <div class="sec-title">Comments</div>
          <span style="font-size:12px;color:var(--text3)" id="commentCount">0 comments</span>
        </div>
        <div class="comment-input-wrap">
          <div class="comment-avatar-me"><i class="fa-solid fa-user"></i></div>
          <div class="comment-box">
            <textarea class="comment-ta" id="commentInput" placeholder="Share your thoughts on this episode..." rows="3"></textarea>
            <div class="comment-actions-row">
              <span class="comment-note">Sign in to post</span>
              <button class="btn-glass" onclick="postComment()"><i class="fa-solid fa-paper-plane"></i> Post</button>
            </div>
          </div>
        </div>
        <div class="comment-list" id="commentList"></div>
      </div>

      <!-- RELATED (bottom) -->
      <div id="relatedSection" style="margin-top:3rem"></div>

    </div>

    <!-- EPISODE PANEL -->
    <div class="ep-panel" id="epPanel">
      <div class="ep-panel-head">
        <div class="ep-panel-title">
          <span>Episodes</span>
          <span id="epTotalLabel" style="font-size:11px;color:var(--text3);font-family:var(--font-body);font-weight:400"></span>
        </div>
        <button class="ep-collapse-btn" id="collapseBtn" onclick="toggleEpPanel()" title="Collapse">
          <i class="fa-solid fa-chevron-up" id="collapseIcon"></i>
        </button>
      </div>
      <div class="ep-panel-body" id="epPanelBody">
        <div class="ep-tools">
          <input type="text" class="ep-search-in" placeholder="Jump to ep..." id="epSearchIn" oninput="jumpToEp(this.value)">
          <div class="ep-layout-btns">
            <button class="ep-lay-btn active" id="gridLayBtn" onclick="setEpLayout('grid')" title="Grid"><i class="fa-solid fa-grid-2"></i></button>
            <button class="ep-lay-btn" id="listLayBtn" onclick="setEpLayout('list')" title="List"><i class="fa-solid fa-list"></i></button>
          </div>
        </div>
        <div class="ep-range" id="epRange"></div>
        <div class="ep-scroll" id="epScroll">
          <div class="ep-nums-grid" id="epNums"></div>
        </div>
      </div>
    </div>

  </div>
</div>
</div>
<div id="footerMount"></div>

<script>
document.getElementById('footerMount').innerHTML = buildFooter();

const params = new URLSearchParams(location.search);
const animeId = parseInt(params.get('id'))||21;
let currentEp = parseInt(params.get('ep'))||1;
let totalEps = 0, animeData = null, epLayout = 'grid', panelCollapsed = false;
let progressTimer = null;

// ── PROGRESS HEARTBEAT ────────────────────────────────────────────────────
// Fires every 10s while watching; buffered on backend via Redis debounce
function startProgressHeartbeat(episodeDbId) {
  clearInterval(progressTimer);
  if (!localStorage.getItem('animex_token') || !episodeDbId) return;
  let position = 0;
  progressTimer = setInterval(() => {
    position += 10;
    apiFetch('/progress', {
      method: 'POST',
      body: JSON.stringify({
        animeId: String(animeId),
        episodeId: episodeDbId,
        position,
        duration: (animeData?.duration ?? 24) * 60,
        completed: false,
      }),
    }).catch(() => {});
  }, 10000);
}
// Stop heartbeat on page leave
window.addEventListener('beforeunload', () => clearInterval(progressTimer));

async function loadWatch(){
  const d = await gqlFetch(`query($id:Int){Media(id:$id,type:ANIME){
    id title{romaji english native}
    coverImage{extraLarge large}bannerImage
    description averageScore episodes status format startDate{year} genres duration
    relations{edges{relationType node{id title{english romaji}coverImage{large}format averageScore type}}}
    recommendations(perPage:10){nodes{mediaRecommendation{id title{english romaji}coverImage{large}format averageScore}}}
  }}`, {id:animeId});
  animeData = d?.data?.Media;
  if(!animeData) return;

  const t = animeData.title.english||animeData.title.romaji;
  document.title = `${t} — Ep ${currentEp} — ANIMEX`;
  document.getElementById('animeTitle').textContent = t;
  document.getElementById('detailLink').href = `anime.html?id=${animeId}`;
  if(animeData.coverImage?.large) document.getElementById('playerBg').src = animeData.coverImage.large;

  renderStrip(animeData);
  renderEpisodes(animeData);
  renderReco(animeData);
  renderRelated(animeData);
  renderComments();
  updateEpNav();
  document.getElementById('skipBtns').style.display='flex';
}

function renderStrip(a){
  const t=a.title.english||a.title.romaji;
  const sc=a.averageScore?(a.averageScore/10).toFixed(1):null;
  const desc=a.description?a.description.replace(/<[^>]*>/g,'').slice(0,200)+'...':'';
  const sub=Math.floor(Math.random()*12)+1;
  const dub=Math.random()>.4?Math.floor(Math.random()*10)+1:null;
  document.getElementById('animeStrip').innerHTML=`
    <img class="strip-poster" src="${a.coverImage?.large||''}" alt="${t}">
    <div class="strip-info">
      <div class="strip-title">${t}</div>
      <div class="strip-meta">
        ${sc?`<span class="badge badge-score">★ ${sc}</span>`:''}
        <span class="badge badge-white">${a.format||'TV'}</span>
        <span class="badge badge-sub">CC ${sub}</span>
        ${dub?`<span class="badge badge-dub">DUB ${dub}</span>`:''}
        ${(a.genres||[]).slice(0,2).map(g=>`<span class="badge badge-white">${g}</span>`).join('')}
      </div>
      <div class="strip-desc">${desc}</div>
    </div>
    <a href="anime.html?id=${a.id}" class="btn-glass" style="flex-shrink:0;align-self:center"><i class="fa-solid fa-circle-info"></i></a>`;
}

function renderEpisodes(a){
  totalEps = a.episodes||24;
  document.getElementById('epTotalLabel').textContent = `${totalEps} eps`;
  // Set initial height for collapse toggle
  buildRanges();
  buildEpGrid(1);
  updateEpNav();
}

function buildRanges(){
  if(totalEps<=100){document.getElementById('epRange').innerHTML='';return}
  const ranges=[];
  for(let i=0;i<totalEps;i+=100) ranges.push([i+1,Math.min(i+100,totalEps)]);
  document.getElementById('epRange').innerHTML=ranges.map((r,i)=>
    `<button class="range-btn${i===0?' active':''}" onclick="buildEpGrid(${r[0]},this)">${r[0]}–${r[1]}</button>`
  ).join('');
}

function buildEpGrid(start=1,btn=null){
  if(btn){document.querySelectorAll('.range-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}
  const end=Math.min(start+99,totalEps);
  const epScroll=document.getElementById('epScroll');
  if(epLayout==='grid'){
    epScroll.innerHTML=`<div class="ep-nums-grid" id="epNums">
      ${Array.from({length:end-start+1},(_,i)=>{
        const n=start+i;
        return `<a href="#" class="ep-btn${n===currentEp?' active':''}" onclick="return navEp(${n})">${n}</a>`;
      }).join('')}
    </div>`;
  } else {
    epScroll.innerHTML=`<div class="ep-list-mode">
      ${Array.from({length:end-start+1},(_,i)=>{
        const n=start+i;
        return `<a href="#" class="ep-list-item${n===currentEp?' active':''}" onclick="return navEp(${n})">
          <span class="ep-list-num">EP ${n}</span>
          <span class="ep-list-title">Episode ${n}</span>
          <span class="ep-list-dur">24:00</span>
        </a>`;
      }).join('')}
    </div>`;
  }
}

function jumpToEp(val){
  const n=parseInt(val);
  if(!n||n<1||n>totalEps) return;
  // Find range containing this episode
  if(totalEps>100){
    const rangeStart=Math.floor((n-1)/100)*100+1;
    const btn=document.querySelector(`.range-btn[onclick*="buildEpGrid(${rangeStart}"]`);
    if(btn) buildEpGrid(rangeStart,btn);
  }
  // Scroll to ep button
  setTimeout(()=>{
    const el=document.querySelector('.ep-btn.active, .ep-list-item.active');
    if(el) el.scrollIntoView({behavior:'smooth',block:'center'});
  },100);
}

function setEpLayout(mode){
  epLayout=mode;
  document.getElementById('gridLayBtn').classList.toggle('active',mode==='grid');
  document.getElementById('listLayBtn').classList.toggle('active',mode==='list');
  buildEpGrid();
}

function toggleEpPanel(){
  panelCollapsed=!panelCollapsed;
  const body=document.getElementById('epPanelBody');
  const icon=document.getElementById('collapseIcon');
  if(panelCollapsed){
    body.style.maxHeight='0';
    body.style.opacity='0';
    body.style.overflow='hidden';
    icon.className='fa-solid fa-chevron-down';
  } else {
    body.style.maxHeight='600px';
    body.style.opacity='1';
    body.style.overflow='';
    icon.className='fa-solid fa-chevron-up';
  }
}

// On init, set max-height for transition
document.getElementById('epPanelBody').style.maxHeight='600px';

function navEp(n){
  currentEp=n;
  history.pushState(null,'',`?id=${animeId}&ep=${n}`);
  document.querySelectorAll('.ep-btn').forEach(e=>e.classList.toggle('active',parseInt(e.textContent)===n));
  document.querySelectorAll('.ep-list-item').forEach(e=>e.classList.toggle('active',parseInt(e.querySelector('.ep-list-num')?.textContent?.replace('EP ',''))||0===n));
  document.getElementById('epLabel').textContent=`Episode ${n}`;
  document.getElementById('epNavLabel').textContent=`Episode ${n}`;
  document.title=`${animeData?.title.english||animeData?.title.romaji} — Ep ${n} — ANIMEX`;
  updateEpNav();
  renderComments();
  resetPlayer();
  window.scrollTo({top:0,behavior:'smooth'});
  return false;
}

function changeEp(dir){const n=currentEp+dir;if(n<1||n>totalEps)return;navEp(n)}

function updateEpNav(){
  document.getElementById('epNavLabel').textContent=`Episode ${currentEp}`;
  document.getElementById('epLabel').textContent=`Episode ${currentEp}`;
  document.getElementById('prevBtn').style.display=currentEp>1?'flex':'none';
  document.getElementById('nextBtn').style.display=currentEp<totalEps?'flex':'none';
}

function resetPlayer(){
  document.getElementById('playerInner').innerHTML=`
    <img class="player-bg" src="${animeData?.coverImage?.large||''}" alt="">
    <button class="play-big" onclick="triggerPlay()"><i class="fa-solid fa-play"></i></button>
    <div class="player-msg">Select a server to play <b>Episode ${currentEp}</b></div>`;
  document.getElementById('skipOutroBtn').style.display='none';
}

function triggerPlay(){
  // Start progress tracking (episodeDbId would come from backend; using animeId+ep as key for now)
  startProgressHeartbeat(`${animeId}:${currentEp}`);
  document.getElementById('playerInner').innerHTML=`
    <img class="player-bg" src="${animeData?.coverImage?.large||''}" alt="">
    <div style="position:relative;z-index:1;text-align:center">
      <i class="fa-solid fa-circle-notch fa-spin" style="font-size:32px;color:var(--text2);margin-bottom:12px;display:block"></i>
      <div style="font-size:13px;color:var(--text2)">Loading stream... <b style="color:var(--white)">wire up your video source</b></div>
    </div>`;
  setTimeout(()=>{
    document.getElementById('playerInner').innerHTML=`
      <img class="player-bg" src="${animeData?.coverImage?.large||''}" alt="">
      <div style="position:relative;z-index:1;text-align:center">
        <div style="font-size:14px;font-weight:600;color:var(--white);margin-bottom:6px">Ready for your video source</div>
        <div style="font-size:12px;color:var(--text2)">Replace with an <code style="background:var(--bg4);padding:2px 6px;border-radius:4px">&lt;iframe src="..."&gt;</code></div>
      </div>`;
    document.getElementById('skipOutroBtn').style.display='flex';
  },1400);
}
function skipSection(t){console.log('Skip',t)}
function setServer(btn){document.querySelectorAll('.server-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');triggerPlay()}
function setLang(l){document.getElementById('lcSub').classList.toggle('active',l==='sub');document.getElementById('lcDub').classList.toggle('active',l==='dub')}

// RECOMMENDED STRIP
function renderReco(a){
  const recs=(a.recommendations?.nodes||[]).filter(n=>n.mediaRecommendation?.coverImage).slice(0,10);
  if(!recs.length){document.getElementById('recoSection').style.display='none';return}
  document.getElementById('recoStrip').innerHTML=recs.map(n=>{
    const r=n.mediaRecommendation;
    const t=r.title?.english||r.title?.romaji||'';
    const sc=r.averageScore?(r.averageScore/10).toFixed(1):'';
    return `<a href="anime.html?id=${r.id}" class="reco-card">
      <img src="${r.coverImage?.large||''}" alt="${t}" loading="lazy">
      <div class="reco-card-body"><div class="reco-title">${t}</div><div class="reco-meta">${r.format||''} ${sc?'★'+sc:''}</div></div>
    </a>`;
  }).join('');
}

// RELATED (bottom)
function renderRelated(a){
  const related=(a.relations?.edges||[]).filter(e=>e.node?.type==='ANIME'&&e.node?.coverImage).slice(0,6);
  if(!related.length){document.getElementById('relatedSection').innerHTML='';return}
  document.getElementById('relatedSection').innerHTML=`
    <div class="sec-header"><div class="sec-title">Related Anime</div></div>
    <div class="bottom-grid">
      ${related.map(e=>{
        const node=e.node;
        const t=node.title?.english||node.title?.romaji||'';
        const sc=node.averageScore?(node.averageScore/10).toFixed(1):null;
        return `<a href="anime.html?id=${node.id}" class="anime-card">
          <div class="card-poster"><img src="${node.coverImage?.large||''}" alt="${t}" loading="lazy">
          ${sc?`<div class="card-score">★${sc}</div>`:''}
          <div class="card-type">${(e.relationType||'').replace(/_/g,' ')}</div></div>
          <div class="card-body"><div class="card-title">${t}</div><div class="card-meta">${node.format||''}</div></div>
        </a>`;
      }).join('')}
    </div>`;
}

// COMMENTS
const MOCK_COMMENTS=[
  {user:'Ryzen_',avatar:'R',time:'2h ago',text:'This episode was insane!! The animation quality really stepped up this arc.',likes:47},
  {user:'sakura_watch',avatar:'S',time:'4h ago',text:"I didn't expect that plot twist at all. Completely caught me off guard lol",likes:31},
  {user:'AnimeVault99',avatar:'A',time:'6h ago',text:"The OST in this episode hits different. Anyone know the track name?",likes:22},
  {user:'tokyodrift_',avatar:'T',time:'8h ago',text:'Just caught up from last week. Worth the wait honestly.',likes:18},
  {user:'NightOwlFan',avatar:'N',time:'12h ago',text:'The ending scene was beautifully animated. Studio really cooked this time.',likes:14},
  {user:'mango_boba',avatar:'M',time:'1d ago',text:"Can someone explain what happened at 18:30? I'm confused about the timeline",likes:9},
];
let commentsData=[...MOCK_COMMENTS];

function renderComments(){
  document.getElementById('commentCount').textContent=`${commentsData.length} comments`;
  document.getElementById('commentList').innerHTML=commentsData.map(c=>`
    <div class="comment-item">
      <div class="c-avatar">${c.avatar}</div>
      <div class="c-body">
        <div class="c-head">
          <span class="c-user">${c.user}</span>
          <span class="c-ep-tag">Ep ${currentEp}</span>
          <span class="c-time">${c.time}</span>
        </div>
        <div class="c-text">${c.text}</div>
        <div class="c-acts">
          <button class="c-act" onclick="likeC(this)"><i class="fa-solid fa-heart"></i> <span class="c-likes">${c.likes}</span></button>
          <button class="c-act"><i class="fa-solid fa-reply"></i> Reply</button>
          <button class="c-act"><i class="fa-solid fa-flag"></i> Report</button>
        </div>
      </div>
    </div>`).join('');
}
function likeC(btn){const el=btn.querySelector('.c-likes');el.textContent=parseInt(el.textContent)+1;btn.style.color='var(--white)'}
function postComment(){
  const input=document.getElementById('commentInput');
  const text=input.value.trim();
  if(!text)return;
  commentsData.unshift({user:'You',avatar:'Y',time:'just now',text,likes:0});
  renderComments();
  input.value='';
}

loadWatch();
</script>
