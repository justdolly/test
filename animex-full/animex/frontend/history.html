<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANIMEX — Watch History</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
.subpage-wrap{max-width:1000px;margin:0 auto;padding:0 2rem 4rem}
.sub-hero{padding:2.5rem 0 2rem;border-bottom:1px solid var(--border);margin-bottom:2rem}
.sub-hero-title{font-family:var(--font-display);font-size:clamp(28px,4vw,44px);font-weight:700;letter-spacing:-1px;color:var(--white);margin-bottom:.5rem}
.sub-hero-sub{font-size:14px;color:var(--text2)}
.history-list{display:flex;flex-direction:column;gap:8px}
.history-item{
  display:flex;gap:12px;padding:14px;
  background:var(--glass);border:1px solid var(--border);
  border-radius:var(--radius);cursor:pointer;transition:all .15s;
  text-decoration:none;color:inherit;
}
.history-item:hover{background:var(--glass-md);border-color:var(--border-hi)}
.hi-thumb{width:60px;height:84px;object-fit:cover;border-radius:7px;flex-shrink:0;background:var(--bg3)}
.hi-info{flex:1;min-width:0}
.hi-title{font-family:var(--font-display);font-size:16px;font-weight:600;color:var(--white);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi-ep{font-size:13px;color:var(--text2);margin-bottom:5px}
.hi-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden;max-width:300px;margin-bottom:3px}
.hi-fill{height:100%;background:var(--white);border-radius:2px}
.hi-meta{font-size:11px;color:var(--text3);display:flex;gap:10px}
.hi-time{margin-left:auto;font-size:11px;color:var(--text3);flex-shrink:0;align-self:center}
.notice{background:var(--glass);border:1px solid var(--border);border-radius:var(--radius);padding:2.5rem;text-align:center}
.notice-icon{font-size:40px;margin-bottom:1rem;opacity:.25}
.notice-title{font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--text2);margin-bottom:.5rem}
.notice-text{font-size:14px;color:var(--text3);line-height:1.7;max-width:360px;margin:0 auto 1.5rem}
.filter-row{display:flex;gap:8px;margin-bottom:1.5rem;flex-wrap:wrap;align-items:center;justify-content:space-between}
</style>
</head>
<body>
<script src="nav.js"></script>
<script>injectNav('');</script>
<div class="page">
  <div class="subpage-wrap">
    <div class="sub-hero">
      <div class="sub-hero-title">Watch History</div>
      <div class="sub-hero-sub">Everything you've watched on ANIMEX</div>
    </div>
    <div class="filter-row">
      <div class="sec-tabs">
        <button class="sec-tab active">All Time</button>
        <button class="sec-tab">This Week</button>
        <button class="sec-tab">This Month</button>
      </div>
      <button class="btn-glass" onclick="alert('Clear history — backend needed!')"><i class="fa-solid fa-trash"></i> Clear All</button>
    </div>
    <div class="notice">
      <div class="notice-icon"><i class="fa-solid fa-clock-rotate-left"></i></div>
      <div class="notice-title">No history yet</div>
      <p class="notice-text">Your watch history will appear here once you start watching. Connect a backend to persist history across sessions.</p>
      <a href="home.html" class="btn-white"><i class="fa-solid fa-play"></i> Start Watching</a>
    </div>
    <div class="history-list" id="historyList" style="margin-top:2rem"></div>
  </div>
  <div id="footerMount"></div>
</div>
<script>
document.getElementById('footerMount').innerHTML = buildFooter();
requireAuthPage();

const MOCK_HISTORY=[
  {id:21,ep:847,pct:100,time:'2h ago'},
  {id:16498,ep:14,pct:56,time:'Yesterday'},
  {id:9253,ep:20,pct:83,time:'2 days ago'},
  {id:1535,ep:7,pct:28,time:'3 days ago'},
];

async function loadHistory(){
  // Try real API first; fall back to mock data
  let apiHistory = null;
  if (localStorage.getItem('animex_token')) {
    const d = await apiFetch('/history?page=1').catch(() => null);
    if (d && Array.isArray(d) && d.length) apiHistory = d;
  }

  if (apiHistory) {
    // Real data from backend
    document.getElementById('historyList').innerHTML = apiHistory.map(h => {
      const t = h.anime?.title?.english || h.anime?.title?.romaji || 'Unknown';
      const pct = h.duration ? Math.round((h.position / h.duration) * 100) : 0;
      return `<a href="watch.html?id=${h.anime?.anilistId || ''}&ep=${h.episode?.number || 1}" class="history-item">
        <img class="hi-thumb" src="${h.anime?.coverImage || ''}" alt="${t}" loading="lazy">
        <div class="hi-info">
          <div class="hi-title">${t}</div>
          <div class="hi-ep">Episode ${h.episode?.number || '?'}</div>
          <div class="hi-bar"><div class="hi-fill" style="width:${pct}%"></div></div>
          <div class="hi-meta"><span>${pct}% watched</span></div>
        </div>
        <div class="hi-time">${new Date(h.updatedAt).toLocaleDateString()}</div>
      </a>`;
    }).join('');
    return;
  }

  // Mock fallback
  const q=MOCK_HISTORY.map((h,i)=>`h${i}:Media(id:${h.id}){id title{english romaji}coverImage{large}format episodes}`).join(' ');
  const d=await gqlFetch(`{${q}}`);
  const list=Object.values(d?.data||{});
  if(!list.length)return;
  document.getElementById('historyList').innerHTML=list.map((a,i)=>{
    const mc=MOCK_HISTORY[i];
    const t=a.title?.english||a.title?.romaji||'';
    return `<a href="watch.html?id=${a.id}&ep=${mc.ep}" class="history-item">
      <img class="hi-thumb" src="${a.coverImage?.large||''}" alt="${t}" loading="lazy">
      <div class="hi-info">
        <div class="hi-title">${t}</div>
        <div class="hi-ep">Episode ${mc.ep}${a.episodes?' / '+a.episodes:''}</div>
        <div class="hi-bar"><div class="hi-fill" style="width:${mc.pct}%"></div></div>
        <div class="hi-meta"><span>${a.format||'TV'}</span><span>${mc.pct}% watched</span></div>
      </div>
      <div class="hi-time">${mc.time}</div>
    </a>`;
  }).join('');
}
loadHistory();
</script>
</body>
</html>
