<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANIMEX — Verify Email</title>
<link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.5.1/css/all.css">
<link rel="stylesheet" href="shared.css">
<style>
.verify-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:40px 16px;position:relative;z-index:2;
}
.verify-card{
  width:100%;max-width:400px;text-align:center;
  background:rgba(16,16,16,0.85);border:1px solid var(--border);
  border-radius:var(--radius-lg);backdrop-filter:blur(24px);
  padding:48px 36px;animation:fadeUp .4s ease;
}
.verify-icon{
  width:72px;height:72px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;margin:0 auto 24px;
}
.icon-loading{background:var(--glass);border:1px solid var(--border);color:var(--text2);}
.icon-success{background:rgba(80,255,140,0.1);border:1px solid rgba(80,255,140,0.2);color:rgba(100,240,160,0.9);}
.icon-error{background:rgba(255,60,60,0.08);border:1px solid rgba(255,60,60,0.2);color:rgba(255,100,100,0.9);}
.verify-title{font-size:20px;font-weight:700;color:var(--white);margin-bottom:10px;font-family:var(--font-display);}
.verify-msg{font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:28px;}
.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="orb-field">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<div class="verify-wrap">
  <div class="verify-card">
    <a href="index.html" style="font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:3px;color:var(--white);text-decoration:none;display:block;margin-bottom:32px">
      ANIME<span style="color:var(--text3)">X</span>
    </a>

    <div class="verify-icon icon-loading" id="verifyIcon">
      <i class="fa-solid fa-circle-notch spin" id="verifyIconI"></i>
    </div>
    <div class="verify-title" id="verifyTitle">Verifying your email…</div>
    <div class="verify-msg" id="verifyMsg">Please wait a moment.</div>
    <div id="verifyAction"></div>
  </div>
</div>

<script>
const API = '/api';

async function verify() {
  const token = new URLSearchParams(location.search).get('token');
  const icon = document.getElementById('verifyIcon');
  const iconI = document.getElementById('verifyIconI');
  const title = document.getElementById('verifyTitle');
  const msg = document.getElementById('verifyMsg');
  const action = document.getElementById('verifyAction');

  if (!token) {
    icon.className = 'verify-icon icon-error';
    iconI.className = 'fa-solid fa-circle-xmark';
    title.textContent = 'Invalid Link';
    msg.textContent = 'No verification token found. Check your email for the correct link.';
    action.innerHTML = `<a href="login.html" class="btn-glass" style="display:inline-flex">Back to Login</a>`;
    return;
  }

  try {
    const r = await fetch(`${API}/auth/verify-email?token=${encodeURIComponent(token)}`);
    const d = await r.json();

    if (r.ok) {
      icon.className = 'verify-icon icon-success';
      iconI.className = 'fa-solid fa-circle-check';
      title.textContent = 'Email Verified!';
      msg.textContent = 'Your account is active. You can now sign in to ANIMEX.';
      action.innerHTML = `<a href="login.html" class="btn-white" style="display:inline-flex;justify-content:center;width:100%;box-sizing:border-box">
        <i class="fa-solid fa-arrow-right"></i> Sign In
      </a>`;
    } else {
      icon.className = 'verify-icon icon-error';
      iconI.className = 'fa-solid fa-circle-xmark';
      title.textContent = d.error === 'Token expired' ? 'Link Expired' : 'Verification Failed';
      msg.textContent = d.error === 'Token expired'
        ? 'This link has expired. Request a new verification email from the login page.'
        : (d.error ?? 'Something went wrong. Try again.');
      action.innerHTML = `<a href="login.html" class="btn-glass" style="display:inline-flex;justify-content:center;width:100%;box-sizing:border-box">
        Back to Login
      </a>`;
    }
  } catch {
    icon.className = 'verify-icon icon-error';
    iconI.className = 'fa-solid fa-circle-xmark';
    title.textContent = 'Connection Error';
    msg.textContent = 'Could not reach the server. Check your connection and try again.';
    action.innerHTML = `<button class="btn-glass" onclick="location.reload()" style="width:100%;box-sizing:border-box">Retry</button>`;
  }
}

verify();
</script>
</body>
</html>
