<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANIMEX — Anime</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
/* BANNER */
.anime-banner {
  position: relative; height: 340px; overflow: hidden;
  margin-top: calc(var(--nav-h) + 32px);
}
.anime-banner img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; }
.banner-shimmer { width:100%;height:100%; }
.banner-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(8,8,8,.1) 0%, rgba(8,8,8,.5) 50%, rgba(8,8,8,1) 100%);
}

/* DETAIL LAYOUT */
.detail-wrap { max-width: var(--max-w); margin: 0 auto; padding: 0 2rem 4rem; }
.detail-header { display: flex; gap: 2rem; margin-top: -100px; position: relative; z-index: 2; margin-bottom: 2rem; }
.detail-poster {
  width: 200px; flex-shrink: 0;
  border-radius: var(--radius); overflow: hidden;
  border: 2px solid var(--border);
  box-shadow: 0 20px 60px rgba(0,0,0,0.7);
}
.detail-poster img { width: 100%; display: block; }
.detail-info { flex: 1; min-width: 0; padding-top: 60px; }
.detail-title-jp { font-size: 13px; color: var(--text3); margin-bottom: 5px; }
.detail-title {
  font-family: var(--font-display); font-size: clamp(24px, 3.5vw, 40px);
  font-weight: 700; line-height: 1.1; letter-spacing: -1px;
  color: var(--white); margin-bottom: 12px;
}
.detail-badges { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 14px; }
.detail-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 1rem; }

/* LAYOUT */
.detail-layout { display: grid; grid-template-columns: 1fr 280px; gap: 2rem; }
.detail-main { min-width: 0; }
.detail-side {}

/* DESCRIPTION */
.desc-box { margin-bottom: 2rem; }
.desc-text {
  font-size: 14px; color: var(--text2); line-height: 1.75;
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
  overflow: hidden; transition: all .3s;
}
.desc-text.expanded { -webkit-line-clamp: unset; }
.desc-toggle {
  font-size: 12px; color: var(--text2); margin-top: 8px;
  display: flex; align-items: center; gap: 5px;
  transition: color .2s;
}
.desc-toggle:hover { color: var(--white); }

/* INFO GRID */
.info-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 2rem; }
.info-cell {
  background: var(--glass); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 12px 14px;
}
.info-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 4px; }
.info-val { font-size: 13px; font-weight: 500; color: var(--text); }

/* GENRE PILLS */
.genre-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 2rem; }
.genre-pill {
  font-size: 12px; padding: 5px 13px; border-radius: 100px;
  background: var(--glass); border: 1px solid var(--border);
  color: var(--text2); transition: all .2s; cursor: pointer;
}
.genre-pill:hover { background: var(--glass-hi); border-color: var(--border-hi); color: var(--white); }

/* EPISODES PREVIEW */
.eps-preview { margin-bottom: 2rem; }
.eps-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(50px,1fr));
  gap: 5px; max-height: 200px; overflow-y: auto; margin-top: 10px;
}
.eps-grid::-webkit-scrollbar { width: 3px; }
.ep-num {
  aspect-ratio: 1; border-radius: 7px;
  background: var(--glass); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 500; color: var(--text2);
  cursor: pointer; transition: all .2s; text-decoration: none;
}
.ep-num:hover { background: var(--white); color: #000; border-color: var(--white); }

/* RELATED */
.related-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); gap: 12px; margin-top: 10px; }

/* SIDE WIDGET */
.side-widget { background: var(--glass); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.2rem; margin-bottom: 1rem; }
.side-widget-title { font-family: var(--font-display); font-size: 13px; font-weight: 600; color: var(--white); margin-bottom: 12px; display: flex; align-items: center; gap: 7px; }
.side-widget-title::before { content:'';width:3px;height:13px;border-radius:2px;background:var(--white);display:block; }
.studio-item { font-size: 13px; color: var(--text2); margin-bottom: 5px; }
.char-list { display: flex; flex-direction: column; gap: 8px; }
.char-item { display: flex; align-items: center; gap: 9px; }
.char-thumb { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; background: var(--bg3); flex-shrink: 0; }
.char-name { font-size: 12px; font-weight: 500; }
.char-role { font-size: 10px; color: var(--text3); }

/* SCORE RING */
.score-ring-wrap { text-align: center; padding: 1rem 0; }
.score-ring {
  width: 90px; height: 90px; border-radius: 50%;
  background: conic-gradient(var(--white) 0%, var(--bg4) 0%);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 8px; position: relative;
}
.score-ring::before {
  content: ''; width: 70px; height: 70px; border-radius: 50%;
  background: var(--bg2); position: absolute;
}
.score-val { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--white); position: relative; z-index: 1; }
.score-label { font-size: 11px; color: var(--text3); }

@media(max-width:900px){
  .detail-layout{grid-template-columns:1fr}
  .detail-header{flex-direction:column;margin-top:-60px}
  .detail-poster{width:140px}
  .detail-info{padding-top:0}
  .info-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<script src="nav.js"></script>
<script>injectNav('');</script>

<div class="page" style="padding-top:0">

  <!-- BANNER -->
  <div class="anime-banner" id="animeBanner">
    <div class="banner-shimmer shimmer"></div>
    <div class="banner-overlay"></div>
  </div>

  <div class="detail-wrap">
    <!-- HEADER -->
    <div class="detail-header" id="detailHeader">
      <div class="detail-poster shimmer" style="height:280px"></div>
      <div class="detail-info">
        <div class="shimmer" style="height:14px;width:200px;border-radius:4px;margin-bottom:8px"></div>
        <div class="shimmer" style="height:36px;width:400px;border-radius:6px;margin-bottom:14px"></div>
        <div style="display:flex;gap:8px;margin-bottom:14px">
          ${Array(4).fill(0).map(()=>`<div class="shimmer" style="height:22px;width:60px;border-radius:5px"></div>`).join('')}
        </div>
        <div style="display:flex;gap:10px">
          <div class="shimmer" style="height:38px;width:130px;border-radius:8px"></div>
          <div class="shimmer" style="height:38px;width:110px;border-radius:8px"></div>
        </div>
      </div>
    </div>

    <!-- MAIN LAYOUT -->
    <div class="detail-layout">
      <div class="detail-main" id="detailMain">
        <div class="shimmer" style="height:14px;border-radius:4px;margin-bottom:6px"></div>
        <div class="shimmer" style="height:14px;width:80%;border-radius:4px;margin-bottom:6px"></div>
        <div class="shimmer" style="height:14px;width:60%;border-radius:4px"></div>
      </div>
      <aside class="detail-side" id="detailSide"></aside>
    </div>
  </div>

  <div id="footerMount"></div>
</div>

<script>
document.getElementById('footerMount').innerHTML = buildFooter();
const animeId = parseInt(new URLSearchParams(location.search).get('id')) || 21;
let animeData = null;
let descExpanded = false;

async function loadAnime() {
  const d = await gqlFetch(`query($id:Int){Media(id:$id,type:ANIME){
    id title{romaji english native}
    bannerImage coverImage{extraLarge large}
    description averageScore popularity
    episodes status format duration
    startDate{year month day} endDate{year}
    genres studios{nodes{name isAnimationStudio}}
    characters(sort:ROLE,perPage:8){edges{role node{id name{full}image{medium}}}}
    relations{edges{relationType node{id title{english romaji}coverImage{large}format averageScore type}}}
    recommendations(perPage:6){nodes{mediaRecommendation{id title{english romaji}coverImage{large}format averageScore}}}
  }}`, { id: animeId });

  animeData = d?.data?.Media;
  if (!animeData) return;

  renderBanner(animeData);
  renderHeader(animeData);
  renderMain(animeData);
  renderSide(animeData);
  document.title = `${animeData.title.english||animeData.title.romaji} — ANIMEX`;
}

function renderBanner(a) {
  const el = document.getElementById('animeBanner');
  if (a.bannerImage) {
    el.innerHTML = `<img src="${a.bannerImage}" alt=""><div class="banner-overlay"></div>`;
  } else {
    el.innerHTML = `<div style="width:100%;height:100%;background:var(--bg3)"></div><div class="banner-overlay"></div>`;
  }
}

function renderHeader(a) {
  const t = a.title.english || a.title.romaji;
  const sc = a.averageScore ? (a.averageScore/10).toFixed(1) : null;
  const sub = Math.floor(Math.random()*12)+1;
  const dub = Math.random()>.4 ? Math.floor(Math.random()*10)+1 : null;
  document.getElementById('detailHeader').innerHTML = `
    <div class="detail-poster">
      <img src="${a.coverImage?.extraLarge||a.coverImage?.large||''}" alt="${t}">
    </div>
    <div class="detail-info">
      ${a.title.native?`<div class="detail-title-jp">${a.title.native}</div>`:''}
      <div class="detail-title">${t}</div>
      <div class="detail-badges">
        ${sc?`<span class="badge badge-score">★ ${sc}</span>`:''}
        <span class="badge badge-white">${a.format||'TV'}</span>
        ${a.startDate?.year?`<span class="badge badge-white">${a.startDate.year}</span>`:''}
        ${a.episodes?`<span class="badge badge-white">${a.episodes} eps</span>`:`<span class="badge badge-white">Ongoing</span>`}
        ${a.duration?`<span class="badge badge-white">${a.duration} min</span>`:''}
        <span class="badge badge-sub">CC SUB ${sub}</span>
        ${dub?`<span class="badge badge-dub">DUB ${dub}</span>`:''}
      </div>
      <div class="detail-actions">
        <a href="watch.html?id=${a.id}&ep=1" class="btn-white"><i class="fa-solid fa-play"></i> Watch Now</a>
        <button class="btn-glass" onclick="alert('Add to list — backend needed!')"><i class="fa-solid fa-plus"></i> Add to List</button>
        <button class="btn-glass" onclick="alert('Bookmarked!')"><i class="fa-regular fa-bookmark"></i> Bookmark</button>
      </div>
    </div>`;
}

function renderMain(a) {
  const desc = a.description ? a.description.replace(/<[^>]*>/g,'') : 'No description available.';
  const studio = a.studios?.nodes?.find(s=>s.isAnimationStudio)?.name || a.studios?.nodes?.[0]?.name || 'Unknown';
  const totalEps = a.episodes || 24;

  // Relations
  const related = (a.relations?.edges||[]).filter(e=>e.node?.type==='ANIME'&&e.node?.coverImage).slice(0,6);
  // Recs
  const recs = (a.recommendations?.nodes||[]).filter(n=>n.mediaRecommendation?.coverImage).slice(0,6);

  document.getElementById('detailMain').innerHTML = `
    <div class="desc-box">
      <div class="sec-title" style="margin-bottom:12px">Synopsis</div>
      <div class="desc-text" id="descText">${desc}</div>
      <button class="desc-toggle" onclick="toggleDesc()" id="descToggle">
        <i class="fa-solid fa-chevron-down" id="descIcon"></i> <span id="descToggleLabel">Read more</span>
      </button>
    </div>

    <div class="info-grid">
      <div class="info-cell"><div class="info-label">Studio</div><div class="info-val">${studio}</div></div>
      <div class="info-cell"><div class="info-label">Status</div><div class="info-val">${a.status||'?'}</div></div>
      <div class="info-cell"><div class="info-label">Episodes</div><div class="info-val">${a.episodes||'?'}</div></div>
      <div class="info-cell"><div class="info-label">Duration</div><div class="info-val">${a.duration||24} min/ep</div></div>
      <div class="info-cell"><div class="info-label">Aired</div><div class="info-val">${a.startDate?.year||'?'} – ${a.endDate?.year||'?'}</div></div>
      <div class="info-cell"><div class="info-label">Popularity</div><div class="info-val">#${(a.popularity||0).toLocaleString()}</div></div>
    </div>

    <div class="genre-pills">
      ${(a.genres||[]).map(g=>`<a href="home.html?genre=${encodeURIComponent(g)}" class="genre-pill">${g}</a>`).join('')}
    </div>

    <div class="eps-preview">
      <div class="sec-header">
        <div class="sec-title">Episodes</div>
        <a href="watch.html?id=${a.id}&ep=1" class="sec-link">Watch from Ep 1 <i class="fa-solid fa-arrow-right"></i></a>
      </div>
      <div class="eps-grid">
        ${Array.from({length:Math.min(totalEps,100)},(_,i)=>
          `<a href="watch.html?id=${a.id}&ep=${i+1}" class="ep-num">${i+1}</a>`
        ).join('')}
        ${totalEps>100?`<div class="ep-num" style="grid-column:span 2;font-size:11px">+${totalEps-100} more</div>`:''}
      </div>
    </div>

    ${related.length?`
    <div class="sec-header" style="margin-top:1rem"><div class="sec-title">Related Anime</div></div>
    <div class="related-grid">
      ${related.map(e=>{
        const node=e.node;
        const t=node.title?.english||node.title?.romaji||'';
        const sc=node.averageScore?(node.averageScore/10).toFixed(1):null;
        return `<a href="anime.html?id=${node.id}" class="anime-card">
          <div class="card-poster"><img src="${node.coverImage?.large||''}" alt="${t}" loading="lazy">
          ${sc?`<div class="card-score">★ ${sc}</div>`:''}
          <div class="card-type">${(e.relationType||'').replace(/_/g,' ')}</div></div>
          <div class="card-body"><div class="card-title">${t}</div><div class="card-meta">${node.format||''}</div></div>
        </a>`;
      }).join('')}
    </div>`:''}

    ${recs.length?`
    <div class="sec-header" style="margin-top:2rem"><div class="sec-title">You Might Also Like</div></div>
    <div class="related-grid">
      ${recs.map(n=>{
        const a=n.mediaRecommendation;
        const t=a.title?.english||a.title?.romaji||'';
        const sc=a.averageScore?(a.averageScore/10).toFixed(1):null;
        return buildCard(a);
      }).join('')}
    </div>`:''}
  `;
}

function renderSide(a) {
  const sc = a.averageScore || 0;
  const pct = sc;
  const chars = a.characters?.edges||[];

  document.getElementById('detailSide').innerHTML = `
    <div class="side-widget">
      <div class="score-ring-wrap">
        <div class="score-ring" style="background:conic-gradient(var(--white) ${pct}%, var(--bg4) ${pct}%)">
          <div class="score-val">${sc?(sc/10).toFixed(1):'?'}</div>
        </div>
        <div class="score-label">Community Score</div>
        <div style="font-size:12px;color:var(--text3);margin-top:4px">${(a.popularity||0).toLocaleString()} users</div>
      </div>
    </div>

    ${a.studios?.nodes?.length?`
    <div class="side-widget">
      <div class="side-widget-title">Studios</div>
      ${a.studios.nodes.slice(0,4).map(s=>`
        <div class="studio-item">${s.name}${s.isAnimationStudio?` <span style="font-size:10px;color:var(--text3)">(Animation)</span>`:''}</div>
      `).join('')}
    </div>`:''}

    ${chars.length?`
    <div class="side-widget">
      <div class="side-widget-title">Characters</div>
      <div class="char-list">
        ${chars.slice(0,6).map(e=>`
          <div class="char-item">
            <img class="char-thumb" src="${e.node?.image?.medium||''}" alt="${e.node?.name?.full||''}">
            <div>
              <div class="char-name">${e.node?.name?.full||''}</div>
              <div class="char-role">${e.role||''}</div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>`:''}
  `;
}

function toggleDesc() {
  descExpanded = !descExpanded;
  document.getElementById('descText').classList.toggle('expanded', descExpanded);
  document.getElementById('descToggleLabel').textContent = descExpanded ? 'Show less' : 'Read more';
  document.getElementById('descIcon').style.transform = descExpanded ? 'rotate(180deg)' : '';
}

loadAnime();
</script>
</body>
</html>
