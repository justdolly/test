<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANIMEX — Watchlist</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
.subpage-wrap{max-width:1000px;margin:0 auto;padding:0 2rem 4rem}
.sub-hero{padding:2.5rem 0 2rem;border-bottom:1px solid var(--border);margin-bottom:2rem}
.sub-hero-title{font-family:var(--font-display);font-size:clamp(28px,4vw,44px);font-weight:700;letter-spacing:-1px;color:var(--white);margin-bottom:.5rem}
.sub-hero-sub{font-size:14px;color:var(--text2)}
.filter-row{display:flex;gap:8px;margin-bottom:1.5rem;flex-wrap:wrap;align-items:center}
.filter-row-select{background:var(--glass);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:13px;color:var(--text);font-family:var(--font-body);outline:none;cursor:pointer}
.notice{background:var(--glass);border:1px solid var(--border);border-radius:var(--radius);padding:2.5rem;text-align:center}
.notice-icon{font-size:40px;margin-bottom:1rem;opacity:.25}
.notice-title{font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--text2);margin-bottom:.5rem}
.notice-text{font-size:14px;color:var(--text3);line-height:1.7;max-width:360px;margin:0 auto 1.5rem}
.wl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}
</style>
</head>
<body>
<script src="nav.js"></script>
<script>injectNav('');</script>
<div class="page">
  <div class="subpage-wrap">
    <div class="sub-hero">
      <div class="sub-hero-title">Watchlist</div>
      <div class="sub-hero-sub">Anime you've saved to watch later</div>
    </div>
    <div class="filter-row">
      <div class="sec-tabs">
        <button class="sec-tab active">All</button>
        <button class="sec-tab">TV</button>
        <button class="sec-tab">Movies</button>
        <button class="sec-tab">OVA</button>
      </div>
      <select class="filter-row-select" style="margin-left:auto">
        <option>Sort: Date Added</option>
        <option>Sort: A–Z</option>
        <option>Sort: Score</option>
      </select>
    </div>
    <div class="notice">
      <div class="notice-icon"><i class="fa-solid fa-bookmark"></i></div>
      <div class="notice-title">Your watchlist is empty</div>
      <p class="notice-text">Save anime to your watchlist while browsing. Sign in and connect a backend to persist your list across sessions.</p>
      <a href="browse.html" class="btn-white"><i class="fa-solid fa-compass"></i> Browse Anime</a>
    </div>
    <div class="wl-grid" id="wlGrid" style="margin-top:2rem"></div>
  </div>
  <div id="footerMount"></div>
</div>
<script>
document.getElementById('footerMount').innerHTML = buildFooter();
requireAuthPage();
// Load some suggestions
async function loadSuggestions(){
  const d = await gqlFetch(`{Page(perPage:6){media(sort:POPULARITY_DESC,type:ANIME,isAdult:false,countryOfOrigin:"JP"){id title{english romaji}coverImage{large}averageScore format startDate{year}status}}}`);
  const list = d?.data?.Page?.media||[];
  document.getElementById('wlGrid').innerHTML = `
    <div style="grid-column:1/-1;margin-top:.5rem">
      <div class="sec-title" style="margin-bottom:1rem">Popular picks to add</div>
    </div>
    ${list.map(a=>buildCard(a)).join('')}`;
}
loadSuggestions();
</script>
</body>
</html>
